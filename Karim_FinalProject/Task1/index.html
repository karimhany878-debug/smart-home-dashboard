<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--I dont know what is this but it came with the "!"Shortcut-->
    <title>Smart Home DashBoard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<h1 id="header">Smart Home DashBoard</h1>

<div id="container">
  <div class="card">
    <div id="Temp">
      <h3>Temperature 🌡️</h3>
    </div>
    <div id="degres">
      30°C<br>
      <strong>Warm</strong>
    </div>
  </div>
<!-- لا مفيش تعليق انا حطه كده و خلاص-->
  <div class="card" id="time">
    <div>
      <h3>Time ⏰</h3>
    </div>
    <div id="clock">20:20</div>
  </div>
<!--لا المراده عشان الشكل بس  :) -->
  <div class="card" id="guests">
    <div>
      <h3>Are There Guests? 👥</h3>
    </div>
    <div id="guest-status">NO!</div>
  </div>
    <div class="card" id="light">
        <h3>lights are</h3 >
        <br>
        <br>
        <button class="btn" onclick="light()" id="light_statues" >ON</button > 
  </div>
</div>
    <script src="script.js" ></script>
</body>
</html>
